# PLACEHOLDERS ONLY. Never commit real tokens (docs/testsuite/02 §3).
# Real values come from the cluster's secret manager (External Secrets, Sealed Secrets, Vault).
# Not listed in kustomization.yaml on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: dcapi-acc-member
  namespace: dcapi-tf-acc
type: Opaque
stringData:
  DCAPI_ENDPOINT: https://dcapi.example.com
  DCAPI_TOKEN: dcapi_sa_<lookup>_<secret>        # tf-acc-runner (role: member)
  DCAPI_ACC_TENANT_ID: platform-test
  DCAPI_ACC_PROJECT_ID: tf-acc
---
apiVersion: v1
kind: Secret
metadata:
  name: dcapi-acc-owner
  namespace: dcapi-tf-acc
type: Opaque
stringData:
  DCAPI_ENDPOINT: https://dcapi.example.com
  DCAPI_TOKEN: dcapi_sa_<lookup>_<secret>        # tf-acc-owner (role: owner)
  DCAPI_ACC_TENANT_ID: platform-test
  DCAPI_ACC_PROJECT_ID: tf-acc
