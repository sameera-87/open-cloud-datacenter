# Runs the node-pool acceptance tests in one pod. Submit on its own to test just this resource;
# the master (dcapi-acc-suite) uses only the "test" template.
# Test plan: docs/testsuite/resources/node-pool.md
#
# Node pools are tested inside the cluster chain test, so this runs the same test as
# dcapi-acc-cluster. It is not listed in the master (that would build two clusters).
#
#   argo submit -n dcapi-tf-acc --from workflowtemplate/dcapi-acc-node-pool \
#     -p image=<registry>/dcapi-acc:<sha> --watch
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dcapi-acc-node-pool
  labels:
    app.kubernetes.io/part-of: dcapi-acc
spec:
  serviceAccountName: dcapi-acc-runner
  entrypoint: test
  onExit: cleanup                        # used only when this template is submitted on its own
  synchronization:
    mutexes: [{name: dcapi-acc-project}] # one run at a time (04 §2)
  podGC: {strategy: OnPodSuccess}        # keep failed pods so their logs can be read
  arguments:
    parameters:
      - name: image                      # e.g. registry.example.com/dcapi-acc:14d3bd6
      - {name: region, value: lk}
      - {name: cluster-image, value: rancher-infra/rke2-ubuntu-22-04}
      - {name: k8s-version, value: v1.33.10+rke2r3}
  templates:
    - name: test
      activeDeadlineSeconds: 7800        # Go timeout + 10 min
      retryStrategy:
        limit: "1"
        retryPolicy: OnError             # pod eviction or node loss only, not test failures
      container:
        image: "{{workflow.parameters.image}}"
        command: [/opt/acc/acctest.test]
        args: ["-test.v", "-test.run=^TestAccCluster_withNodePool$", "-test.timeout=120m"]
        envFrom:
          - secretRef: {name: dcapi-acc-member}
        env:
          - {name: DCAPI_ACC_RUN_ID, value: "{{=workflow.name[len(workflow.name)-5:]}}"}
          - {name: DCAPI_ACC_REGION, value: "{{workflow.parameters.region}}"}
          - {name: DCAPI_ACC_CLUSTER_IMAGE, value: "{{workflow.parameters.cluster-image}}"}
          - {name: DCAPI_ACC_K8S_VERSION, value: "{{workflow.parameters.k8s-version}}"}
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits:   {cpu: "1",  memory: 1Gi}

    - name: cleanup
      steps:
        - - name: sweep
            templateRef: {name: dcapi-acc-suite, template: sweep}
