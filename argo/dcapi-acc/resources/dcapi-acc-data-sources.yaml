# Runs the data-sources acceptance tests in one pod. Submit on its own to test just this resource;
# the master (dcapi-acc-suite) uses only the "test" template.
# Test plan: docs/testsuite/resources/data-sources.md
#
#   argo submit -n dcapi-tf-acc --from workflowtemplate/dcapi-acc-data-sources \
#     -p image=<registry>/dcapi-acc:<sha> --watch
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dcapi-acc-data-sources
  labels:
    app.kubernetes.io/part-of: dcapi-acc
spec:
  serviceAccountName: dcapi-acc-runner
  entrypoint: test
  onExit: cleanup                        # used only when this template is submitted on its own
  synchronization:
    mutexes: [{name: dcapi-acc-project}] # one run at a time (04 §2)
  podGC: {strategy: OnPodSuccess}        # keep failed pods so their logs can be read
  arguments:
    parameters:
      - name: image                      # e.g. registry.example.com/dcapi-acc:14d3bd6
      - {name: region, value: lk}
      - {name: vm-image, value: rancher-infra/ubuntu-22-04}
      - name: vm-image-display-name       # no default: set it once known for the environment
  templates:
    - name: test
      activeDeadlineSeconds: 1200        # Go timeout + 10 min
      retryStrategy:
        limit: "1"
        retryPolicy: OnError             # pod eviction or node loss only, not test failures
      container:
        image: "{{workflow.parameters.image}}"
        command: [/opt/acc/acctest.test]
        args: ["-test.v", "-test.run=^TestAccDataSource_", "-test.timeout=10m"]
        envFrom:
          - secretRef: {name: dcapi-acc-member}
        env:
          - {name: DCAPI_ACC_RUN_ID, value: "{{=workflow.name[len(workflow.name)-5:]}}"}
          - {name: DCAPI_ACC_REGION, value: "{{workflow.parameters.region}}"}
          - {name: DCAPI_ACC_VM_IMAGE, value: "{{workflow.parameters.vm-image}}"}
          - {name: DCAPI_ACC_VM_IMAGE_DISPLAY_NAME, value: "{{workflow.parameters.vm-image-display-name}}"}
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits:   {cpu: "1",  memory: 1Gi}

    - name: cleanup
      steps:
        - - name: sweep
            templateRef: {name: dcapi-acc-suite, template: sweep}
